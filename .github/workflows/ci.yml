name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests-linux:
    name: CompositionKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/CompositionKit

  ios-unsigned:
    name: iOS unsigned build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: CompositionKit tests (macOS)
        run: swift test --package-path Packages/CompositionKit

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (Release, iphoneos, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Framewise.xcodeproj \
            -scheme Framewise \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build > build.log 2>&1 || { grep -E "error:" build.log | head -50; tail -80 build.log; exit 1; }
          grep -cE "warning:" build.log || true

      - name: Package unsigned IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Framewise.app
          test -d "$APP"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Localizations)" -A2
          ls "$APP" | grep -E "lproj|Assets.car"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Framewise-unsigned.ipa Payload
          ls -lh Framewise-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Framewise-unsigned-ipa
          path: Framewise-unsigned.ipa

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Framewise-unsigned.ipa \
            --title "Framewise $GITHUB_REF_NAME" \
            --notes "Unsigned iOS build from CI (Xcode 16.4, iOS 17+). Sign it yourself (e.g. with your own Apple ID) before installing on a device." \
            || gh release upload "$GITHUB_REF_NAME" Framewise-unsigned.ipa --clobber
